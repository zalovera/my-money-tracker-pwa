<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#A9C9E8">
  <meta name="description" content="Personal Finance and Expense Tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Money Tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>My Money Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      overflow: hidden; 
      background: #FAFAF7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #gasFrame { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block;
    }
    #installBtn {
      position: fixed; 
      bottom: 24px; 
      left: 50%; 
      transform: translateX(-50%);
      padding: 12px 28px; 
      background: #A9C9E8; 
      color: #fff;
      border: none; 
      border-radius: 24px; 
      font-weight: 600; 
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(169,201,232,.5);
      cursor: pointer; 
      display: none; 
      z-index: 999;
      animation: slideUp 0.4s ease;
    }
    #installBtn:hover { background: #7FAED6; }
    @keyframes slideUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: #FAFAF7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 1000;
      transition: opacity 0.3s;
    }
    #loadingScreen.hide { opacity: 0; pointer-events: none; }
    .loader-logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #A9C9E8, #7FAED6);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(169,201,232,.4);
    }
    .loader-logo svg { width: 32px; height: 32px; color: #fff; }
    .loader-text { color: #8A94A6; font-size: 13px; }
    .loader-spinner {
      width: 24px; height: 24px;
      border: 2.5px solid #EEF0F3;
      border-top-color: #A9C9E8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loadingScreen">
    <div class="loader-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
        <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
        <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
      </svg>
    </div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Memuat My Money Tracker...</div>
  </div>

  <!-- Iframe ke Google Apps Script -->
  <iframe 
    id="gasFrame" 
    src="GANTI_DENGAN_URL_WEB_APP_GAS_ANDA"
    allow="clipboard-read; clipboard-write"
    title="My Money Tracker Application">
  </iframe>

  <!-- Tombol install PWA -->
  <button id="installBtn">📱 Instal Aplikasi</button>

  <script>
    // === Service Worker Registration ===
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('✅ Service Worker registered:', reg.scope))
          .catch(err => console.log('❌ SW registration failed:', err));
      });
    }

    // === Hide loading screen after iframe loads ===
    const gasFrame = document.getElementById('gasFrame');
    const loadingScreen = document.getElementById('loadingScreen');
    gasFrame.addEventListener('load', () => {
      setTimeout(() => loadingScreen.classList.add('hide'), 300);
    });
    // Fallback: hide after 3s max
    setTimeout(() => loadingScreen.classList.add('hide'), 3000);

    // === PWA Install Prompt ===
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('✅ beforeinstallprompt fired');
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        alert('Buka menu Chrome (⋮) → "Instal aplikasi" atau "Tambahkan ke Layar Utama"');
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('User choice:', outcome);
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      console.log('✅ PWA installed');
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
